name: YouTube Downloader with Browser Impersonate

on:
  workflow_dispatch:
    inputs:
      links_text:
        description: '۱. متن حاوی لینک‌های یوتیوب را اینجا پیست کنید'
        required: true
        type: string
      cookies_text:
        description: '۲. کل متن داخل فایل cookies.txt را اینجا پیست کنید'
        required: true
        type: string

jobs:
  download-audio:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Latest yt-dlp
      run: |
        sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp

    - name: Process Text and Download Audio
      run: |
        mkdir -p downloads
        
        # ۱. ذخیره کوکی‌ها
        echo "${{ github.event.inputs.cookies_text }}" > github_cookies.txt
        
        # ۲. ذخیره متن لینک‌ها
        cat << 'EOF' > input_text.txt
        ${{ github.event.inputs.links_text }}
        EOF
        
        # ۳. دانلود با شبیه‌ساز مرورگر کروم، جعل هویت کلاینت و هدرهای فیک
        grep -o 'https://www.youtube.com/watch?v=[^[:space:]]*' input_text.txt | while read -r url; do
          echo "Processing URL with Impersonate: $url"
          yt-dlp -i \
            --cookies github_cookies.txt \
            --impersonate "chrome" \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --sc-proxy \
            --sleep-requests 2 \
            --sleep-interval 5 \
            -f "ba" \
            --extract-audio \
            --audio-format opus \
            --ppa "ffmpeg:-b:a 24k -vbr off" \
            -o "downloads/%(title)s.%(ext)s" \
            "$url" || echo "Failed to download $url"
        done

    - name: Zip Downloads
      run: |
        zip -r compressed-audios.zip downloads/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: youtube-audio-files
        path: compressed-audios.zip
        retention-days: 3
